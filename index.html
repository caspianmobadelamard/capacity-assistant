<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563EB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Capacity" />
<meta name="description" content="دستیار مهندسی تعیین ظرفیت تجهیزات — کاسپین مبدل آمارد" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Capacity Assistant v5 — Caspian Mobaddel Amard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#F4F6FB;--card:#FFFFFF;--card-2:#FAFBFE;
  --text:#0F172A;--text-soft:#64748B;--text-mute:#94A3B8;
  --border:#E2E8F0;--border-2:#CBD5E1;
  --brand-1:#0F172A;--brand-2:#1E3A8A;--brand-3:#2563EB;--brand-4:#3B82F6;--brand-5:#60A5FA;
  --accent:#06B6D4;--accent-2:#22D3EE;
  --gold:#F59E0B;--gold-2:#FBBF24;--gold-3:#FCD34D;
  --success:#10B981;--success-bg:#ECFDF5;--success-bd:#A7F3D0;
  --warn:#F59E0B;--warn-bg:#FFFBEB;--warn-bd:#FDE68A;
  --danger:#EF4444;--danger-bg:#FEF2F2;--danger-bd:#FECACA;
  --info:#3B82F6;--info-bg:#EFF6FF;--info-bd:#BFDBFE;
  --radius:14px;--radius-sm:10px;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm:0 2px 4px rgba(15,23,42,0.05),0 1px 2px rgba(15,23,42,0.03);
  --shadow-md:0 4px 12px rgba(15,23,42,0.07),0 2px 4px rgba(15,23,42,0.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,0.10),0 4px 8px rgba(15,23,42,0.05);
  --shadow-brand:0 12px 32px rgba(37,99,235,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.75;min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 85% -10%,rgba(37,99,235,0.08),transparent 60%),radial-gradient(1000px 500px at -10% 20%,rgba(6,182,212,0.06),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(245,158,11,0.05),transparent 60%);pointer-events:none;z-index:0;}
.app{max-width:1180px;margin:0 auto;position:relative;z-index:1;padding:0 14px 80px;}

.sticky-shell{position:sticky;top:0;z-index:100;padding:10px 0 8px;background:linear-gradient(180deg,var(--bg) 60%,rgba(244,246,251,0.85) 100%);backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);}
.header{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#0B1120 0%,#14275A 35%,#1E3A8A 55%,#2563EB 80%,#06B6D4 120%);color:#fff;padding:18px 22px;box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,0.08);}
.header::before{content:"";position:absolute;top:-40%;right:-10%;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,0.35) 0%,transparent 65%);animation:floatA 14s ease-in-out infinite;pointer-events:none;}
.header::after{content:"";position:absolute;bottom:-50%;left:-10%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,0.28) 0%,transparent 65%);animation:floatA 18s ease-in-out infinite reverse;pointer-events:none;}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-24px,18px) scale(1.05);}}
.header-inner{position:relative;z-index:2;display:flex;align-items:center;gap:16px;}
.logo-wrap{width:66px;height:66px;flex:0 0 66px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,0.16),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 8px 24px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.logo-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.25) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;}
@keyframes shine{0%{transform:translateX(-100%);}45%,100%{transform:translateX(100%);}}
.logo-svg{width:52px;height:52px;position:relative;z-index:1;}
.flame{transform-origin:20px 14px;animation:flameSway 1.4s ease-in-out infinite;}
.flame-inner{transform-origin:20px 16px;animation:flameSway 1.1s ease-in-out infinite reverse;}
@keyframes flameSway{0%,100%{transform:scale(1,1) rotate(0deg);opacity:1;}50%{transform:scale(1.08,0.92) rotate(-2deg);opacity:0.92;}}
.steam-1{animation:steamRise 2.6s ease-in-out infinite;}
.steam-2{animation:steamRise 3.2s ease-in-out infinite 0.5s;}
.steam-3{animation:steamRise 2.9s ease-in-out infinite 1s;}
@keyframes steamRise{0%{transform:translateY(0);opacity:0;}20%{opacity:0.9;}100%{transform:translateY(-10px);opacity:0;}}
.water-drop{animation:waterDrip 2.4s ease-in-out infinite;}
@keyframes waterDrip{0%,100%{transform:translateY(0);opacity:1;}50%{transform:translateY(2px);opacity:0.75;}}
.header-text{flex:1;min-width:0;}
.header-text .title{font-size:1.15rem;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-text .subtitle{font-size:0.78rem;opacity:0.82;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-badge{display:inline-flex;align-items:center;gap:6px;font-size:0.66rem;font-weight:700;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);padding:3px 10px;border-radius:99px;margin-top:6px;}
.header-badge .dot{width:6px;height:6px;border-radius:50%;background:#22D3EE;box-shadow:0 0 8px #22D3EE;animation:pulseDot 2s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.55;transform:scale(1.4);}}

.tabs-sticky{position:sticky;top:96px;z-index:99;background:rgba(244,246,251,0.92);backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);padding:8px 0 6px;margin-bottom:8px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;}
.tabs::-webkit-scrollbar{height:4px;}
.tabs::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px;}
.tabs button{padding:10px 18px;border:1.5px solid var(--border);background:var(--card);border-radius:99px;font-family:inherit;font-size:0.82rem;font-weight:700;color:var(--text-soft);cursor:pointer;white-space:nowrap;transition:all 0.25s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-xs);}
.tabs button .ic{margin-left:4px;font-size:0.9rem;}
.tabs button.active{background:linear-gradient(135deg,var(--brand-3),var(--brand-2));color:#fff;border-color:var(--brand-2);box-shadow:var(--shadow-brand);transform:translateY(-1px);}
.tabs button:hover:not(.active){border-color:var(--brand-3);color:var(--brand-3);transform:translateY(-1px);box-shadow:var(--shadow-sm);}

.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding:0 2px;}
.subtabs button{padding:7px 14px;border:1px solid var(--border);background:var(--card);border-radius:99px;font-family:inherit;font-size:0.76rem;font-weight:600;color:var(--text-soft);cursor:pointer;transition:all 0.2s;}
.subtabs button.active{background:linear-gradient(135deg,var(--accent),var(--brand-4));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(6,182,212,0.35);}
.subtabs button:hover:not(.active){border-color:var(--accent);color:var(--accent);}

.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:box-shadow 0.3s;overflow:hidden;}
.card::before{content:"";position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle at top right,rgba(37,99,235,0.05),transparent 70%);pointer-events:none;}
.card:hover{box-shadow:var(--shadow-md);}
.card h2{font-size:1.08rem;font-weight:800;color:var(--text);margin-bottom:4px;letter-spacing:-0.2px;}
.card .hint{font-size:0.8rem;color:var(--text-soft);margin-bottom:18px;line-height:1.7;}
.badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(6,182,212,0.12),rgba(37,99,235,0.12));color:#0E7490;font-size:0.7rem;font-weight:800;padding:5px 12px;border-radius:99px;border:1px solid rgba(6,182,212,0.25);margin-bottom:12px;letter-spacing:0.2px;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:0.78rem;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:0.1px;}
.field .unit{color:var(--text-mute);font-weight:500;font-size:0.7rem;margin-right:4px;}
input,select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;background:var(--card-2);color:var(--text);transition:all 0.2s;appearance:none;}
input:hover,select:hover{border-color:var(--border-2);}
input:focus,select:focus{outline:none;background:#fff;border-color:var(--brand-3);box-shadow:0 0 0 4px rgba(37,99,235,0.12);}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2364748B' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:left 14px center;padding-left:34px;}
input[type=checkbox]{width:auto;accent-color:var(--brand-3);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.row3,.row4{grid-template-columns:1fr 1fr;}.header-text .title{font-size:1rem;}}
@media(max-width:400px){.row3,.row4{grid-template-columns:1fr;}}

.calc-settings{border:1.5px solid var(--warn-bd);background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 100%);border-radius:var(--radius-sm);padding:14px 16px;margin:0 0 16px;position:relative;}
.calc-settings legend{font-size:0.76rem;font-weight:800;color:#92400E;padding:0 10px;background:#FFFBEB;border-radius:6px;border:1px solid var(--warn-bd);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;background:linear-gradient(135deg,var(--brand-3) 0%,var(--brand-2) 100%);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:0.92rem;font-weight:800;cursor:pointer;transition:all 0.25s cubic-bezier(.4,0,.2,1);width:100%;box-shadow:0 4px 14px rgba(37,99,235,0.28),inset 0 1px 0 rgba(255,255,255,0.15);letter-spacing:0.2px;position:relative;overflow:hidden;}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.25) 50%,transparent 70%);transform:translateX(-100%);transition:transform 0.7s;}
.btn:hover::before{transform:translateX(100%);}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(37,99,235,0.4),inset 0 1px 0 rgba(255,255,255,0.2);}
.btn:active{transform:translateY(0);}
.btn.secondary{background:var(--card);color:var(--brand-3);border:1.5px solid var(--brand-3);box-shadow:var(--shadow-xs);}
.btn.secondary:hover{background:rgba(37,99,235,0.05);}

.gauge{background:linear-gradient(135deg,#ECFDF5 0%,#D1FAE5 100%);border:1px solid var(--success-bd);border-right:5px solid var(--success);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:10px;transition:transform 0.2s,box-shadow 0.2s;box-shadow:var(--shadow-xs);}
.gauge:hover{transform:translateX(-3px);box-shadow:var(--shadow-sm);}
.gauge .k{font-size:0.76rem;color:var(--text-soft);font-weight:700;margin-bottom:3px;}
.gauge .v{font-size:1.35rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-0.5px;}
.gauge .v small{font-size:0.68rem;font-weight:600;color:var(--text-soft);margin-right:5px;}
.gauge .note{font-size:0.73rem;color:var(--text-soft);margin-top:4px;line-height:1.6;}
.gauge.gold{background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 100%);border-color:var(--warn-bd);border-right-color:var(--warn);}
.gauge.info{background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 100%);border-color:var(--info-bd);border-right-color:var(--info);}
.gauge.err{background:linear-gradient(135deg,#FEF2F2 0%,#FECACA 100%);border-color:var(--danger-bd);border-right-color:var(--danger);}

.formula{background:linear-gradient(135deg,#0F172A,#1E293B);border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;font-size:0.76rem;direction:ltr;text-align:left;font-family:'SF Mono','Consolas','Monaco',monospace;color:#93C5FD;overflow-x:auto;line-height:1.9;box-shadow:var(--shadow-md);position:relative;}
.formula::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand-3),var(--gold));border-radius:var(--radius-sm) var(--radius-sm) 0 0;}
.formula .ft{color:var(--gold-2);font-weight:800;font-size:0.74rem;margin-bottom:10px;direction:rtl;text-align:right;font-family:'Vazirmatn',Tahoma,sans-serif;display:flex;align-items:center;gap:6px;}
.formula .fl{margin:2px 0;}
.formula .hl{color:#34D399;font-weight:700;}
.formula .ref{color:#94A3B8;font-size:0.68rem;margin-top:10px;direction:rtl;text-align:right;font-family:'Vazirmatn',Tahoma,sans-serif;font-style:italic;border-top:1px dashed rgba(148,163,184,0.3);padding-top:8px;}

.notice{background:var(--info-bg);border:1px solid var(--info-bd);border-right:4px solid var(--info);border-radius:var(--radius-sm);padding:12px 16px;font-size:0.8rem;color:#1E40AF;margin-bottom:14px;line-height:1.7;display:flex;gap:10px;align-items:flex-start;}
.notice::before{content:"💡";font-size:1.1rem;flex-shrink:0;}

.disclaimer{text-align:center;font-size:0.72rem;color:var(--text-mute);padding:24px 16px;line-height:1.9;border-top:1px solid var(--border);margin-top:24px;}
.disclaimer strong{color:var(--brand-3);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 24px;border-radius:99px;font-size:0.85rem;opacity:0;pointer-events:none;transition:all 0.3s;z-index:200;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.summary-box{background:linear-gradient(135deg,#0F172A,#1E293B);color:#E2E8F0;border-radius:var(--radius-sm);padding:14px 16px;font-size:0.82rem;line-height:1.9;white-space:pre-wrap;font-family:'SF Mono','Consolas',monospace;border:none;width:100%;resize:vertical;min-height:140px;direction:ltr;text-align:left;box-shadow:var(--shadow-md);}

table.std{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:8px;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-xs);}
table.std th,table.std td{border:1px solid var(--border);padding:8px 10px;text-align:center;}
table.std th{background:linear-gradient(135deg,var(--brand-3),var(--brand-2));color:#fff;font-weight:700;font-size:0.78rem;}
table.std tr:nth-child(even){background:var(--card-2);}

.calc-result{background:linear-gradient(135deg,#ECFDF5 0%,#D1FAE5 100%);border:2px solid var(--success-bd);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-top:14px;box-shadow:var(--shadow-sm);}
.calc-result .num{font-size:1.9rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.calc-result .lbl{font-size:0.78rem;color:var(--text-soft);margin-top:4px;}

.conversion-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px;}
.conv-item{background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:0.82rem;transition:all 0.2s;}
.conv-item:hover{background:var(--info-bg);border-color:var(--info-bd);}
.conv-item .ck{color:var(--text-soft);font-size:0.72rem;display:block;margin-bottom:3px;}
.conv-item .cv{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.calc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;}
@media(max-width:640px){.calc-grid{grid-template-columns:1fr;}}

fieldset{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:0 0 14px;}
legend{font-size:0.78rem;font-weight:800;color:var(--brand-3);padding:0 8px;}

.fab{position:fixed;bottom:20px;left:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--brand-3));color:#fff;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(6,182,212,0.45);font-size:22px;display:flex;align-items:center;justify-content:center;z-index:90;transition:transform 0.2s;font-weight:700;}
.fab:hover{transform:scale(1.08) rotate(15deg);}

.panel,.subpanel{display:none;}
.panel.active,.subpanel.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* PDF Toolbar */
.pdf-toolbar{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:2px dashed var(--border);flex-wrap:wrap;}
.pdf-toolbar .btn-pdf{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.25s;box-shadow:0 4px 12px rgba(220,38,38,0.3);flex:1;min-width:140px;}
.pdf-toolbar .btn-pdf:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(220,38,38,0.4);}
.pdf-toolbar .btn-pdf::before{content:"📄";}
.pdf-toolbar .btn-print-local{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;background:var(--card);color:var(--brand-3);border:1.5px solid var(--brand-3);border-radius:var(--radius-sm);font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.25s;flex:1;min-width:140px;}
.pdf-toolbar .btn-print-local:hover{background:rgba(37,99,235,0.06);transform:translateY(-2px);}
.pdf-toolbar .btn-print-local::before{content:"🖨️";}

.pdf-exporting{background:#fff !important;padding:24px !important;border-radius:0 !important;box-shadow:none !important;width:210mm !important;max-width:210mm !important;}
.pdf-exporting .gauge{background:#F0FDF4 !important;border:1px solid #BBF7D0 !important;break-inside:avoid;page-break-inside:avoid;}
.pdf-exporting .formula{background:#F8FAFC !important;color:#1E40AF !important;border-right:3px solid #2563EB !important;break-inside:avoid;page-break-inside:avoid;}
.pdf-exporting .formula::before{display:none !important;}
.pdf-exporting .card{border:1px solid #E2E8F0 !important;box-shadow:none !important;page-break-inside:avoid;}
.pdf-exporting .badge{background:#DBEAFE !important;color:#1E40AF !important;}
.pdf-exporting .summary-box{background:#F8FAFC !important;color:#0F172A !important;border:1px solid #E2E8F0 !important;}
</style>
</head>
<body>
<div class="app">

  <!-- ==================== هدر چسبنده ==================== -->
  <div class="sticky-shell">
    <header class="header">
      <div class="header-inner">
        <div class="logo-wrap">
          <svg class="logo-svg" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
              <path class="flame" d="M20 12 C18 15,17 18,19 21 C20 23,22 23,22 21 C23 19,22 16,20 12 Z" fill="#FBBF24"/>
              <path class="flame-inner" d="M20 14 C19 16,19 18,20 20 C21 21,21.5 20,21 19 C20.5 17,20.5 16,20 14 Z" fill="#F59E0B"/>
            </g>
            <g stroke="#60A5FA" stroke-width="1.4" stroke-linecap="round" fill="none">
              <path class="steam-1" d="M34 16 q2 -3 4 0 q2 3 4 0"/>
              <path class="steam-2" d="M36 12 q2 -3 4 0 q2 3 4 0"/>
              <path class="steam-3" d="M38 18 q2 -3 4 0 q2 3 4 0"/>
            </g>
            <rect x="8" y="28" width="32" height="18" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.2"/>
            <rect x="12" y="24" width="6" height="4" rx="1" fill="#60A5FA"/>
