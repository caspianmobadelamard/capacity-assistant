<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1929" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Capacity Assistant | کاسپین مبدل آمارد</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
:root{
  --bg:#0a1929; --bg2:#132f4c; --card:#0d2137; --border:#1e4976;
  --txt:#e6edf3; --txt2:#8b949e; --orange:#ff8c42; --blue:#4dabf7;
  --green:#2ea043; --yellow:#d29922; --red:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Vazirmatn",Tahoma,sans-serif;
  background:var(--bg); color:var(--txt); padding:12px;
  direction:rtl; min-height:100vh; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:1000px; margin:0 auto; background:var(--bg2);
  border-radius:20px; padding:20px; border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
header{text-align:center; border-bottom:2px solid var(--border);
  padding-bottom:16px; margin-bottom:20px;}
.logo{width:70px; height:70px; border-radius:14px; background:#fff;
  padding:6px; margin-bottom:8px;}
header h1{font-size:22px; color:#f0f6fc;}
header .sub{color:var(--txt2); font-size:13px; margin-top:4px;}
header .brand{color:var(--orange); font-weight:700;}

.tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
.tabs button{
  padding:14px 10px; border:1.5px solid var(--border);
  background:var(--bg); color:var(--txt2); border-radius:12px;
  font-size:15px; font-weight:600; cursor:pointer; transition:.2s;
  font-family:inherit;
}
.tabs button.active{background:var(--green); color:#fff; border-color:var(--green);}
.tabs button:hover:not(.active){border-color:var(--blue); color:var(--txt);}

.section{background:var(--bg); border-radius:14px; padding:16px;
  margin-bottom:14px; border:1px solid var(--border);}
.section h2{font-size:15px; color:#f0f6fc; margin-bottom:12px;
  border-right:4px solid var(--orange); padding-right:10px;}
.section h2 small{font-size:11px; color:var(--txt2); font-weight:400;}

.row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.fg{margin-bottom:10px;}
.fg label{display:block; font-size:12px; color:#c9d1d9; font-weight:600; margin-bottom:5px;}
.fg label .u{color:var(--txt2); font-weight:400; font-size:10px;}
.fg input,.fg select{
  width:100%; padding:10px 12px; border:1.5px solid var(--border);
  border-radius:9px; font-size:14px; background:var(--card);
  color:var(--txt); font-family:inherit; transition:.2s;
}
.fg input:focus,.fg select:focus{
  border-color:var(--blue); outline:none;
  box-shadow:0 0 0 3px rgba(77,171,247,.15);
}
.fg input[type=number]::-webkit-outer-spin-button,
.fg input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}

.radio-grp{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.radio-grp label{
  display:flex; align-items:center; gap:5px; background:var(--card);
  padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer;
  border:1.5px solid var(--border); transition:.2s; color:#c9d1d9;
}
.radio-grp label.sel{background:var(--green); border-color:var(--green); color:#fff;}
.radio-grp label:hover:not(.sel){border-color:var(--blue);}
.radio-grp input{accent-color:var(--orange);}

.btn-calc{
  width:100%; padding:16px; background:var(--green); color:#fff;
  border:none; border-radius:12px; font-size:17px; font-weight:700;
  cursor:pointer; margin:14px 0; font-family:inherit; transition:.2s;
}
.btn-calc:hover{background:#3fb950; transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(46,160,67,.3);}

#output{display:none; background:var(--bg); border-radius:16px;
  padding:18px; margin-top:16px; border:1px solid var(--border);}
#output>h2{font-size:17px; color:#f0f6fc; margin-bottom:16px;
  border-right:4px solid var(--orange); padding-right:10px;}

.card{background:var(--card); border-radius:12px; padding:14px 16px;
  margin-bottom:12px; border:1px solid var(--border);
  border-right-width:5px; border-right-color:var(--orange);}
.card h3{font-size:15px; color:#f0f6fc; margin-bottom:8px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.card h3 .badge{background:var(--green); font-size:10px;
  padding:2px 10px; border-radius:20px; color:#fff; font-weight:500;}
.item{display:flex; justify-content:space-between; padding:5px 0;
  border-bottom:1px solid var(--border); font-size:13px;
  flex-wrap:wrap; gap:6px;}
.item:last-child{border-bottom:none;}
.item .v{font-weight:700; color:var(--orange); font-size:14px;}
.item .u{color:var(--txt2); font-size:11px; margin-right:3px;}
.item .c{color:var(--blue); font-size:11px; margin-right:6px;}

.formula{background:var(--bg2); border-radius:10px;
  padding:12px 14px; margin-top:8px; border-right:3px solid var(--blue);
  font-size:12px; direction:ltr; text-align:left;
  font-family:Consolas,Monaco,monospace; color:#79c0ff; overflow-x:auto;}
.formula .ft{color:var(--yellow); font-weight:700; font-size:11px;
  margin-bottom:6px; direction:rtl; text-align:right;
  font-family:'Vazirmatn',Tahoma,sans-serif;}
.formula .fl{margin:2px 0;}
.formula .ref{color:var(--txt2); font-size:10px; margin-top:6px;
  direction:rtl; text-align:right;
  font-family:'Vazirmatn',Tahoma,sans-serif;}

.btn-print{padding:10px 20px; background:var(--green); color:#fff;
  border:none; border-radius:10px; font-weight:600; cursor:pointer;
  font-size:13px; font-family:inherit;}
.btn-reset{padding:10px 20px; background:var(--card); color:var(--txt);
  border:1px solid var(--border); border-radius:10px; cursor:pointer;
  font-size:13px; font-family:inherit;}
.btn-print:hover{background:#3fb950;}
.btn-reset:hover{background:var(--bg);}

footer{margin-top:20px; text-align:center; font-size:11px;
  color:var(--txt2); border-top:1px solid var(--border); padding-top:14px;}

@media(max-width:640px){
  .row,.row3{grid-template-columns:1fr;}
  #app{padding:12px; border-radius:14px;}
  header h1{font-size:17px;}
  .logo{width:56px; height:56px;}
}
@media print{
  .tabs,.btn-calc,.btn-print,.btn-reset,.section{display:none!important;}
  #output{display:block!important; background:#fff!important; color:#000!important;}
  .card{background:#f9f9f9!important; border:1px solid #ccc!important;
    color:#000!important; page-break-inside:avoid;}
  .card .v{color:#c45500!important;}
  .formula{background:#f0f0f0!important; color:#0066cc!important;}
  body,#app{background:#fff!important; box-shadow:none; border:none;}
  header h1,header .sub,.card h3{color:#000!important;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="./icon-192.png" alt="Logo" class="logo" />
    <h1>Capacity Assistant</h1>
    <p class="sub"><span class="brand">کاسپین مبدل آمارد</span> | دستیار تعیین ظرفیت تجهیزات</p>
  </header>

  <!-- تب‌های اصلی: تفکیک کامل حوزه بخار و آبگرم -->
  <div class="tabs">
    <button id="tabHW" class="active">💧 دیگ آبگرم / آب‌داغ</button>
    <button id="tabST">🔥 دیگ بخار</button>
  </div>

  <!-- مدل دیگ -->
  <div class="section">
    <h2>🔄 انتخاب مدل دیگ <small>(دستی از کاتالوگ کاسپین)</small></h2>
    <div class="fg">
      <label>مدل مورد نظر</label>
      <select id="model"></select>
    </div>
  </div>

  <!-- مکان پروژه -->
  <div class="section">
    <h2>📍 مکان پروژه <small>(حداقل اطلاعات از خریدار)</small></h2>
    <div class="fg">
      <label>نوع کاربری</label>
      <select id="location"></select>
    </div>
    <div class="fg">
      <label>تعداد <span class="u" id="unitLbl">(واحد)</span></label>
      <input type="number" id="count" value="100" min="1" />
    </div>
  </div>

  <!-- ورودی‌های پویا -->
  <div id="dynamic"></div>

  <!-- تنظیمات پیشرفته -->
  <div class="section">
    <h2>⚙️ تنظیمات پیشرفته</h2>
    <div class="fg">
      <label>الگوی مصرف</label>
      <div class="radio-grp" id="patternGrp">
        <label class="sel"><input type="radio" name="pat" value="continuous" checked /> پیوسته (Continuous)</label>
        <label><input type="radio" name="pat" value="peak" /> پیک‌دار (Peak)</label>
      </div>
    </div>
    <div class="fg">
      <label>ضریب اطمینان (Safety Factor)</label>
      <div class="radio-grp" id="safetyGrp">
        <label class="sel"><input type="radio" name="sf" value="1.2" checked /> ۱.۲ بهینه</label>
        <label><input type="radio" name="sf" value="1.3" /> ۱.۳ Fulton</label>
        <label><input type="radio" name="sf" value="1.35" /> ۱.۳۵ محافظه‌کارانه</label>
      </div>
    </div>
    <div class="row">
      <div class="fg"><label>سختی آب ورودی <span class="u">ppm CaCO₃</span></label>
        <input type="number" id="hardIn" value="250" min="0" /></div>
      <div class="fg"><label>سختی خروجی مطلوب <span class="u">ppm</span></label>
        <input type="number" id="hardOut" value="50" min="0" /></div>
    </div>
    <div class="row">
      <div class="fg"><label>دمای آب تغذیه <span class="u">°C</span></label>
        <input type="number" id="feedT" value="85" min="20" max="100" /></div>
      <div class="fg"><label>ساعت بین دو احیا (سختی‌گیر)</label>
        <input type="number" id="svcH" value="8" min="2" max="24" /></div>
    </div>
  </div>

  <button class="btn-calc" id="calcBtn">⚡ محاسبه و مشاوره</button>

  <div id="output">
    <h2>📊 نتایج مشاوره فنی</h2>
    <div id="results"></div>
    <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-print" onclick="window.print()">🖨️ چاپ / PDF</button>
      <button class="btn-reset" id="resetBtn">🔄 پروژه جدید</button>
    </div>
  </div>

  <footer>
    <p>طراحی برای <strong>کاسپین مبدل آمارد</strong> | منابع: ASHRAE، Fulton، WQA، EOS</p>
    <p style="margin-top:4px;">GitHub: @caspianmobadelamard</p>
  </footer>
</div>

<script>
// ================================================================
// 1. پایگاه داده
// ================================================================

// مکان‌ها با مصرف سرانه ASHRAE و فیکسچر
const LOC = {
  residential:{n:'مسکونی (آپارتمان/ویلا)',u:'واحد',perCap:50,
    fix:{lav:2,bat:1,shw:1,ks:1,wm:1,dw:1},df:.30,sf:1.25,U:1.2,area:100},
  dorm:{n:'خوابگاه',u:'نفر',perCap:13,
    fix:{lav:1,shw:1},df:.25,sf:1.0,U:1.2,area:20},
  nursing:{n:'خانه سالمندان',u:'تخت',perCap:18.4,
    fix:{lav:1,shw:1,bat:1},df:.25,sf:1.0,U:1.0,area:25},
  hospital:{n:'بیمارستان',u:'تخت',perCap:25,
    fix:{lav:1,shw:1,ks:1,wm:1},df:.25,sf:1.0,U:1.0,area:50},
  hotel:{n:'هتل',u:'اتاق',perCap:20,
    fix:{lav:1,bat:1,shw:1,ks:1},df:.25,sf:.80,U:1.0,area:40},
  office:{n:'اداری',u:'کارمند',perCap:5,
    fix:{lav:1},df:.30,sf:2.0,U:1.2,area:15},
  school:{n:'مدرسه/دانشگاه',u:'دانش‌آموز',perCap:1.8,
    fix:{lav:1},df:.30,sf:2.0,U:1.5,area:10},
  prison:{n:'زندان',u:'دوش',perCap:12,
    fix:{shw:1,lav:1},df:.30,sf:1.0,U:1.2,area:5},
  restaurant:{n:'رستوران',u:'وعده',perCap:3,
    fix:{ks:1,lav:1},df:.30,sf:1.5,U:1.5,area:2},
  pool:{n:'استخر',u:'مترمربع',perCap:2,
    fix:{shw:1,lav:1},df:.30,sf:1.0,U:1.5,area:1},
  greenhouse:{n:'گلخانه',u:'مترمربع',perCap:1.5,
    fix:{},df:.30,sf:1.0,U:6.53,area:1},
  laundry:{n:'رخت‌شویخانه',u:'کیلو لباس',perCap:5,
    fix:{wm:1,lav:1},df:.30,sf:1.5,U:1.5,area:3},
  dairy:{n:'لبنیات',u:'تن شیر',perCap:100,
    fix:{ks:1,lav:1},df:.35,sf:1.0,U:1.5,area:5},
  slaughter:{n:'کشتارگاه',u:'تن لاشه',perCap:80,
    fix:{shw:1,lav:1},df:.35,sf:1.0,U:1.5,area:8},
  industrial:{n:'کارخانه/صنایع',u:'نفر',perCap:10,
    fix:{shw:1,lav:1},df:.35,sf:1.5,U:1.5,area:20},
  sauna:{n:'سونا بخار',u:'مترمربع',perCap:0,
    fix:{},df:.30,sf:1.0,U:0,area:1}
};

// مصرف وسایل بهداشتی (GPH) - ASHRAE Table 10
const FIX = {
  lav:{apt:2,hotel:6,hosp:6,off:2},
  bat:{apt:20,hotel:20,hosp:10},
  shw:30, ks:10, dw:15, wm:35
};

// مدل‌های دیگ (کاتالوگ کاسپین)
const MODELS = {
  hw:['سه‌پاس (Three-Pass)','شعله برگشتی (Reverse Flame)',
      'فایرباکس (Firebox)','آذران (Azaran)','پکیج سری M','پکیج سری H'],
  st:['افقی وت‌بک (Horizontal)','فایرباکس (Firebox)','عمودی (Vertical)']
};

// ظرفیت‌های استاندارد کاسپین (کاتالوگ)
const STD_HW=[80000,100000,150000,200000,300000,400000,500000,600000,800000,
  1000000,1250000,1500000,2000000,2500000,3000000,4000000,5000000,6000000];
const STD_ST=[100,150,200,300,500,750,1000,1500,2000,3000,4000,5000,7500,10000,15000];

// رقبا
const PAK_HW=[100000,150000,200000,300000,500000,800000,1000000,1500000,2000000,3000000];
const DAB_HW=[60000,100000,200000,400000,600000,800000,1000000,1500000,2000000];
const PAK_ST=[100,200,300,500,1000,1500,2000,3000,5000,10000];
const DAB_ST=[60,100,200,300,500,1000,2000];

// U گلخانه (P.V. Nelson)
const GH_U={
  nylon_single:6.53, nylon_double:4.54,
  glass_single:6.42, glass_double:3.69,
  poly_double:3.29
};

// سونا (EOS / Harvia)
const SA_K1={vent:.75,no_vent:.52};
const SA_K2={acrylic:1,foam:1.25,concrete:1.5,stone:2};

// ================================================================
// 2. ابزار
// ================================================================
const U={
  lToGal:l=>l/3.78541, galToL:g=>g*3.78541,
  lpmToGpm:l=>l/3.78541, kgToLb:k=>k*2.20462,
  kwToKcal:k=>k*860, kcalToKw:k=>k/860,
  kwToBtu:k=>k*3412.14, kwToHp:k=>k*1.34102
};

function nearest(v,arr){let n=arr[0]; for(let x of arr){if(x>=v){n=x;break;} n=x;} return n;}
function fmt(n,d=1){if(typeof n!=='number'||isNaN(n))return '0';
  return n.toLocaleString('fa-IR',{maximumFractionDigits:d});}

// ================================================================
// 3. محاسبات
// ================================================================

// الگوی مصرف
function patFactor(pat){return pat==='peak'?1.5:1.0;}

// --- آبگرم مصرفی (ASHRAE Fixture-based) ---
function calcDHW(loc,count,pat,sf){
  const L=LOC[loc];
  const items=[];
  let totalGPH=0;
  for(const [f,q] of Object.entries(L.fix)){
    const F=FIX[f];
    let c=0;
    if(typeof F==='number') c=F;
    else if(loc==='hotel') c=F.hotel||F.apt||0;
    else if(loc==='hospital') c=F.hosp||F.apt||0;
    else if(loc==='office') c=F.off||F.apt||0;
    else c=F.apt||F.hotel||F.hosp||0;
    const tot=q*count*c;
    totalGPH+=tot;
    items.push({f,q,c,tot});
  }
  const pf=patFactor(pat);
  const peakGPH=totalGPH*L.df*pf*sf;
  const storageGal=peakGPH*L.sf;
  const storageL=U.galToL(storageGal);
  const dT=90; // 60-10 = 50°C = 90°F
  const btu=peakGPH*8.33*dT;
  const kw=btu/3412;
  const kcal=U.kwToKcal(kw);
  return {items,totalGPH,peakGPH,storageGal,storageL,btu,kw,kcal,df:L.df,sf:L.sf,dT,pf};
}

// --- بار گرمایش (ASHRAE) ---
function calcHeat(loc,count,sf){
  const L=LOC[loc];
  const area=count*L.area;
  const dT=20;
  const cond=area*L.U*dT;
  const vol=area*3;
  const ach=0.5;
  const cfm=(vol*ach)/1.699;
  const infBtu=1.08*cfm*(dT*1.8);
  const infW=infBtu/3.412;
  const total=(cond+infW)*sf;
  return {area,U:L.U,dT,cond,infW,infBtu,total,kw:total/1000,btu:total*3.412};
}

// --- دیگ آبگرم (ترکیب DHW + Heating) ---
function calcHW(loc,count,pat,sf){
  const dhw=calcDHW(loc,count,pat,sf);
  const ht=calcHeat(loc,count,sf);
  const maxKW=Math.max(dhw.kw,ht.kw);  // ضریب همزمانی max نه sum
  const maxKcal=maxKW*860;
  const std=nearest(maxKcal,STD_HW);
  const pak=nearest(std,PAK_HW);
  const dab=nearest(std,DAB_HW);
  return {dhw,ht,maxKW,maxKcal,std,pak,dab};
}

// --- دیگ بخار (Fulton) ---
function calcST(loc,count,pat,sf,hardIn,hardOut,feedT,svcH){
  const L=LOC[loc];
  const area=count*L.area;
  const dT=20;
  const heatW=area*L.U*dT;
  // Fulton: Q = (W × Sp × ΔT) / (L × h)
  const waterKgH=(heatW*3600)/(4.186*1000);
  const Sp=4.186, rise=60, Lv=2048, h=1;
  let steamKgH=(waterKgH*Sp*rise)/(Lv*h);
  const pf=patFactor(pat);
  steamKgH=steamKgH*pf*sf;
  const std=nearest(steamKgH,STD_ST);
  const pak=nearest(std,PAK_ST);
  const dab=nearest(std,DAB_ST);

  // سختی‌گیر (WQA)
  const gpm=steamKgH/60*0.26;
  const removed=hardIn-hardOut;
  const gpg=removed/17.1;
  const grains=Math.ceil(gpm*gpg*60*svcH);
  const resin=Math.ceil(grains/30000*10)/10;
  const diam=Math.ceil(Math.sqrt(resin*2.5)*10);
  const salt=Math.round(resin*15*10)/10;

  // دی‌اریتور
  const dT2=100-feedT;
  const dSteam=Math.round(steamKgH*(dT2/100)*0.25*10)/10;
  const dTank=Math.round(steamKgH*0.2);

  // کندانس
  const conV=Math.round(steamKgH*0.3);

  // منبع انبساط
  const sysV=steamKgH*2.5;
  const expC=Math.ceil(sysV*0.06*1.2);
  const expO=Math.ceil(expC*2);
  const expD=Math.ceil(Math.cbrt(expC*1.2)*10);

  return {heatW,steamKgH,std,pak,dab,gpm,removed,gpg,grains,resin,diam,salt,
    dSteam,dTank,dT2,conV,sysV,expC,expO,expD};
}

// --- گلخانه (P.V. Nelson) ---
function calcGH(L,W,H,cover,sf){
  const u=GH_U[cover]||6.53;
  const A=2*(L+W)*H+(L*W);
  const dT=15;
  const q=A*u*dT*sf;
  return {A,u,dT,q,kw:q/1000,kcal:(q/1000)*860};
}

// --- سونا (EOS) ---
function calcSauna(L,W,H,vent,const_,sf){
  const V=L*W*H;
  const k1=SA_K1[vent]||.75;
  const k2=SA_K2[const_]||1.5;
  const kw=V*k1*k2*sf;
  return {V,k1,k2,kw,steam:kw*1.5};
}

// --- استخر (ASHRAE) ---
function calcPool(L,W,D,target,amb,wind,turn,sf){
  const V=L*W*D;
  const A=L*W;
  const dT=Math.max(target-amb,5);
  const maint=A*(.5+.3*wind)*dT*1.16;
  const heatUp=(V*1000*4.18*dT)/(turn*3600);
  const total=(maint+heatUp)*sf;
  const gal=V*264.172;
  return {V,A,dT,maint,heatUp,total,kw:total/1000,gal,turn};
}

// --- فیلتر شنی (تصفیه آب - جداگانه) ---
function calcFilter(V,turn){
  const m3h=V/turn;
  const gpm=m3h*4.403;
  const lr=15;
  const area=gpm/lr;
  const areaM2=area*0.0929;
  const diamFt=Math.sqrt(area*4/Math.PI);
  const diamCm=diamFt*30.48;
  const hp=Math.ceil(m3h*0.05*10)/10;
  return {m3h,gpm,lr,area,areaM2,diamCm,diamIn:diamFt*12,hp,kw:hp*.746};
}

function card(title,items,badge=''){
  const d=document.createElement('div');
  d.className='card';
  const its=items.map(i=>`<div class="item"><span>${i.l}</span>
    <span><span class="v">${i.v}</span><span class="u">${i.u}</span>
    ${i.c?`<span class="c">(${i.c})</span>`:''}</span></div>`).join('');
  d.innerHTML=`<h3>${title} ${badge?`<span class="badge">${badge}</span>`:''}</h3>${its}`;
  return d;
}

function formula(title,lines,ref){
  const d=document.createElement('div');
  d.className='formula';
  d.innerHTML=`<div class="ft">📐 ${title}</div>
    ${lines.map(l=>`<div class="fl">${l}</div>`).join('')}
    <div class="ref">📚 مرجع: ${ref}</div>`;
  return d;
}

      {l:'حجم بسته (دیافراگمی)',v:eC,u:'لیتر',c:`${fmt(U.lToGal(eC),1)} gal`},

  }

document.getElementById('calcBtn').onclick=()=>{
  const loc=location.value;
  const count=parseInt(document.getElementById('count').value)||1;
  const sf=parseFloat(document.querySelector('input[name=sf]:checked').value);
  const pat=document.querySelector('input[name=pat]:checked').value;
  try{
    if(curType==='st'){
      showST(loc,count,pat,sf);
    } else {
      showHW(loc,count,pat,sf);
    }
    document.getElementById('output').style.display='block';
    document.getElementById('output').scrollIntoView({behavior:'smooth'});
  }catch(e){
    results.innerHTML=`<div class="card"><h3>❌ خطا</h3><p>${e.message}</p></div>`;
    document.getElementById('output').style.display='block';
    console.error(e);
  }
};

document.getElementById('resetBtn').onclick=()=>{
  document.getElementById('output').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
};

setTab('hw');

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
console.log('✅ Capacity Assistant loaded.');
</script>
</body>
</html>
